[project]
name = "eval-lite"
version = "0.1.0"
description = "A zero-dependency JSONL eval logger for grading LLM/agent outputs without standing up a dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agenticjennifer" }]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["eval_log"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
